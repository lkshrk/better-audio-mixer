name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: "16.4"
          - os: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Install XcodeGen
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/xcodegen" && sudo ./install.sh)
          xcodegen --version
        env:
          XCODEGEN_VERSION: "2.46.0"

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        run: |
          test -f BamKit/Package.resolved
          test -f bam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          swift test --package-path BamKit --force-resolved-versions
          python3 -B scripts/analyze-audio-latency.py --self-test
          python3 -B scripts/tests/test_collect_audio_diagnostics.py
          xcodebuild -project bam.xcodeproj -scheme bam \
            -onlyUsePackageVersionsFromResolvedFile \
            -configuration Debug -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build test
