name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # CI listens only to branch pushes, so tags on tested tips need their own trigger.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Serialize runs because annotated tag and commit SHAs cannot share a per-SHA race guard.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # Cheap ubuntu gate so the macOS release job only starts for a CI-verified, unreleased vX.Y.Z tag.
  gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Annotated tag pushes set github.sha to the tag object, not its commit.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Verify latest CI passed
        id: civerify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Dereference through any annotated tag to the tested commit.
          TARGET_SHA="$(git rev-parse 'HEAD^{commit}')"

          # A failed rerun must supersede an older success for the same commit.
          latest="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${TARGET_SHA}" \
            -f event=push \
            -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"

          if [ -z "${latest}" ]; then
            echo "::error::No CI run found for commit ${TARGET_SHA}."
            exit 1
          fi

          IFS=$'\t' read -r ci_status ci_conclusion <<< "${latest}"
          if [ "${ci_status}" = "completed" ] && [ "${ci_conclusion}" = "success" ]; then
            echo "Latest CI run for ${TARGET_SHA} passed."
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag or older workflow_run arriving mid-CI is deferred to the latest successful workflow_run trigger.
          if [ "${ci_status}" != "completed" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "CI for ${TARGET_SHA} is still running; deferring to the workflow_run trigger."
            exit 0
          fi

          echo "::error::Latest CI run for ${TARGET_SHA} finished with ${ci_conclusion:-unknown}."
          exit 1

      - name: Check for release tag
        id: tag
        if: steps.civerify.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No vX.Y.Z tag points at this commit; skipping release."
            exit 0
          fi
          # Tag-push and workflow_run can both pass the gate for the same tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping duplicate publish."
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  # One release ships both artifacts: the notarized bam.app (bam.zip) and the
  # notarized Stream Deck plugin (.streamDeckPlugin), attached to the same vX.Y.Z
  # release. The plugin versions in lockstep with the app — its manifest Version
  # must be X.Y.Z.N and is verified against the tag before anything is built.
  # streamdeck.yml stays as a manual-dispatch fallback for plugin-only rebuilds.
  release:
    needs: gate
    if: needs.gate.outputs.tag != ''
    runs-on: macos-26
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      TAG: ${{ needs.gate.outputs.tag }}
      PLUGIN_DIR: StreamDeck/me.harke.better-audio-mixer.sdPlugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - name: Verify app and plugin versions match tag
        run: |
          VER="${TAG#v}"
          APP_VER=$(sed -nE 's/^ *MARKETING_VERSION: "([^"]*)".*/\1/p' project.yml)
          if [ "$APP_VER" != "$VER" ]; then
            echo "::error::project.yml MARKETING_VERSION ($APP_VER) does not match tag $TAG"
            exit 1
          fi
          MANIFEST_VER=$(/usr/bin/python3 -c 'import json;print(json.load(open("'"$PLUGIN_DIR"'/manifest.json"))["Version"])')
          if [ "${MANIFEST_VER%.*}" != "$VER" ]; then
            echo "::error::plugin manifest Version ($MANIFEST_VER) does not match tag $TAG (expected ${VER}.N)"
            exit 1
          fi
          echo "manifest $MANIFEST_VER matches tag $TAG"

      - name: Require pinned dependencies
        run: |
          for lockfile in BamKit/Package.resolved bam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; do
            if [ ! -f "$lockfile" ]; then
              echo "::error::Release source lacks $lockfile. Backport dependency locks and create a new release tag; historical tags cannot be rebuilt reproducibly."
              exit 1
            fi
          done

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install XcodeGen
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/xcodegen" && sudo ./install.sh)
          xcodegen --version
        env:
          XCODEGEN_VERSION: "2.46.0"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')

      - name: Generate project
        run: xcodegen generate

      - name: Build & sign (Developer ID)
        run: |
          xcodebuild -project bam.xcodeproj -scheme bam \
            -onlyUsePackageVersionsFromResolvedFile \
            -configuration Release -derivedDataPath .build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            build

      - name: Package
        run: |
          APP=".build/Build/Products/Release/bam.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" bam.zip

      - name: Notarize & staple
        id: pkg
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          APP=".build/Build/Products/Release/bam.app"
          echo "$NOTARY_KEY_P8" | base64 --decode > $RUNNER_TEMP/notary.p8
          SUBMIT_JSON=$(xcrun notarytool submit bam.zip \
            --key $RUNNER_TEMP/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --output-format json --wait)
          echo "$SUBMIT_JSON"
          SUBMIT_ID=$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
          echo "Notarization status: $STATUS (id $SUBMIT_ID)"
          # Always print the detailed notary log; on Invalid it lists the exact issues.
          xcrun notarytool log "$SUBMIT_ID" \
            --key $RUNNER_TEMP/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" || true
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization not accepted (status $STATUS) — see log above."
            exit 1
          fi
          xcrun stapler staple "$APP"
          rm bam.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" bam.zip
          echo "sha256=$(shasum -a 256 bam.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build plugin universal binary
        run: |
          cd BamKit
          swift build --force-resolved-versions -c release --arch arm64 --arch x86_64 --product BAMStreamDeck
          BINDIR="$(swift build --force-resolved-versions -c release --arch arm64 --arch x86_64 --product BAMStreamDeck --show-bin-path)"
          echo "BINDIR=$BINDIR" >> "$GITHUB_ENV"

      - name: Assemble & sign plugin bundle
        run: |
          mkdir -p "$PLUGIN_DIR/bin"
          cp "$BINDIR/BAMStreamDeck" "$PLUGIN_DIR/bin/BAMStreamDeck"
          lipo -info "$PLUGIN_DIR/bin/BAMStreamDeck"
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "$PLUGIN_DIR/bin/BAMStreamDeck"
          codesign --verify --strict --verbose=2 "$PLUGIN_DIR/bin/BAMStreamDeck"

      - name: Validate plugin (manifest, layouts, structure)
        run: npx --yes @elgato/cli@1.9.0 validate "$PLUGIN_DIR"

      - name: Notarize plugin
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > $RUNNER_TEMP/notary.p8
          ditto -c -k --sequesterRsrc --keepParent "$PLUGIN_DIR" plugin.zip
          SUBMIT_JSON=$(xcrun notarytool submit plugin.zip \
            --key $RUNNER_TEMP/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --output-format json --wait)
          echo "$SUBMIT_JSON"
          SUBMIT_ID=$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
          xcrun notarytool log "$SUBMIT_ID" \
            --key $RUNNER_TEMP/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" || true
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Plugin notarization not accepted (status $STATUS) — see log above."
            exit 1
          fi
          # A loose plugin bundle cannot be stapled; first launch relies on the
          # online notarization check (document: first run needs network).

      - name: Package .streamDeckPlugin
        run: npx --yes @elgato/cli@1.9.0 pack "$PLUGIN_DIR" --output dist --force

      - name: Create GitHub release (app + plugin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" bam.zip dist/me.harke.better-audio-mixer.streamDeckPlugin \
            --title "$TAG" \
            --generate-notes \
            --notes "sha256: \`${{ steps.pkg.outputs.sha256 }}\`"

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          SHA="${{ steps.pkg.outputs.sha256 }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lkshrk/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp Casks/bam.rb tap/Casks/bam.rb
          sed -i '' -E "s/version \".*\"/version \"${VERSION}\"/" tap/Casks/bam.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"${SHA}\"/" tap/Casks/bam.rb
          cd tap
          git add Casks/bam.rb
          # Stage first: `git diff` ignores untracked files, so a brand-new
          # cask would never be detected. `--cached` sees new + modified.
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "bam: bump to ${VERSION}"
            git push
          fi
