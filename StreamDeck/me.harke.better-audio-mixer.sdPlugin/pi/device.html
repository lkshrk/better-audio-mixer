<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <sdpi-item label="Device">
    <sdpi-select id="mix" setting="mix"></sdpi-select>
  </sdpi-item>
  <sdpi-item label="Action" id="modeRow">
    <sdpi-select id="mode" setting="mode" default="mute">
      <option value="mute">Mute</option>
      <option value="adjust">Adjust</option>
      <option value="set">Set</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item id="dialHint">
    <p class="hint">On a dial: rotate adjusts, press mutes.</p>
  </sdpi-item>
  <sdpi-item label="Amount" id="stepRow">
    <div class="range">
      <sdpi-range id="step" min="-25" max="25" step="1"></sdpi-range>
      <span class="value" id="stepVal">+5%</span>
    </div>
  </sdpi-item>
  <sdpi-item label="Set %" id="posRow">
    <div class="range">
      <sdpi-range id="pos" min="0" max="100" step="1"></sdpi-range>
      <span class="value" id="posVal">50%</span>
    </div>
  </sdpi-item>
  <sdpi-item label="Dial LCD" id="styleRow">
    <sdpi-select id="style" setting="style" default="channel">
      <option value="channel">Channel Strip</option>
      <option value="meter">Stereo Monitor</option>
      <option value="retro">Retro VU</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Key style" id="keyStyleRow">
    <sdpi-select id="keyStyle" setting="keyStyle" default="channel">
      <option value="channel">Channel Strip</option>
      <option value="meter">Stereo Monitor</option>
      <option value="retro">Retro VU</option>
    </sdpi-select>
  </sdpi-item>

  <script src="common.js"></script>
  <script>initVolumePI({ hasMix: true });</script>
</body>
</html>
