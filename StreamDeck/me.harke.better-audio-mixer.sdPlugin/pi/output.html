<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <sdpi-item label="Mode">
    <sdpi-select id="mode" setting="mode" default="set">
      <option value="set">Set device</option>
      <option value="toggle">Toggle A &harr; B</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Device" id="rowA">
    <sdpi-select id="a" setting="a"></sdpi-select>
  </sdpi-item>
  <sdpi-item label="Device B" id="rowB">
    <sdpi-select id="b" setting="b"></sdpi-select>
  </sdpi-item>
  <sdpi-item label="Name">
    <sdpi-checkbox id="showName" setting="showName" label="Show below the icon"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item>
    <p class="hint">The device icon shows centered on the key; the name below is optional.</p>
    <p class="hint">If a selected device is unavailable, the key flashes an alert and keeps the current output.</p>
  </sdpi-item>

  <script src="common.js"></script>
  <script>
    const modeEl = document.getElementById("mode");
    const aEl = document.getElementById("a");
    const bEl = document.getElementById("b");
    const rowA = document.getElementById("rowA");
    const rowB = document.getElementById("rowB");
    let lastOutputs = [];

    function applyMode() {
      const toggle = (modeEl.value || settings.mode || "set") === "toggle";
      show(rowB, toggle);
      rowA.setAttribute("label", toggle ? "Device A" : "Device");
    }

    onOutputs = (outputs) => {
      lastOutputs = outputs;
      fillOutputDropdown(aEl, outputs, "a");
      fillOutputDropdown(bEl, outputs, "b", { allowNone: true });
    };
    onSettings = () => {
      applyMode();
      onOutputs(lastOutputs);
    };
    onReady = requestOutputs;
    modeEl.addEventListener("valuechange", applyMode);
  </script>
</body>
</html>
